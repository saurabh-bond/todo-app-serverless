name: Deploy to Dev
on:
    push:
        branches:
            - develop
permissions: 
    id-token: write
    contents: read

jobs:
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with: 
                python-version: '3.12'
            - uses: aws-actions/setup-sam@v2
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1
            - name: Build SAM Backend
              run: |
                cd backend
                sam build --use-container
            - name: Ensure SAM deployment bucket exists
              run: |
                aws s3api head-bucket --bucket todo-app-sam-deployments-dev --region us-east-1 2>/dev/null || \
                aws s3api create-bucket --bucket todo-app-sam-deployments-dev --region us-east-1
            - name: Deploy SAM Backend
              run: |
                cd backend
                sam deploy --config-env dev --no-fail-on-empty-changeset
